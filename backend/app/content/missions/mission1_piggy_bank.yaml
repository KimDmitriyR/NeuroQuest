# Source: КОНВЕРТЫ_С_МИССИЯМИ.docx, МИССИЯ 1 (ФИНСТАРТАП): «3D-копилка с
# бюджетными секторами»

sector_slug: finstartup-2-0

mission:
  title: "3D-копилка с бюджетными секторами"
  description: >-
    Собери прозрачную 3D-копилку с 4 отсеками (40/30/20/10 %) и физически
    распредели «капитал» по правилу 40% обязательные расходы, 30%
    накопления, 20% развлечения, 10% инвестиции. Затем реши задачу на
    форс-мажор, перекладывая монеты между отсеками.
  instructions: >-
    Шаг 1. Собери копилку 15×10×10 см с 4 прозрачными окнами-секторами.
    Шаг 2. Распредели 10 монет: 4 — обязательные расходы, 3 — накопления,
    2 — развлечения, 1 — инвестиции. Шаг 3. Сломался телефон, ремонт стоит
    3 монеты — реши, откуда их взять, и физически переложи монеты.
    Сфотографируй итоговый результат: видно все 4 сектора, правильное
    распределение 4/3/2/1 и решение форс-мажора.
  validation_type: photo
  achievement: financial_planner

achievements:
  - key: financial_planner
    title: "Финансовый планировщик"
    is_badge: false
