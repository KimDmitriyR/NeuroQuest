mission:
  title: "Алгоритм навигации «Робо-курьер»"
  description: >-
    Собери поле-лабиринт 5×5, расставь препятствия по схеме и "запрограммируй"
    робота-курьера карточками команд («Вперёд», «Налево», «Направо»), чтобы
    он доставил груз до цели, не задев препятствия.
  instructions: >-
    Шаг 1. Расставь препятствия на поле точно по схеме, робота — на старт,
    груз — на финиш. Шаг 2. Разложи карточки команд в ряд, составляя
    алгоритм маршрута. Шаг 3. Проведи фигурку робота по полю строго по
    разложенным карточкам; если он врезался в препятствие — поменяй одну-две
    карточки (дебаггинг) и попробуй снова. Сфотографируй поле, когда робот
    стоит на клетке финиша, а ряд карточек-команд выложен рядом без
    пропусков.
  validation_type: photo
  achievement: algorithmic_navigator

