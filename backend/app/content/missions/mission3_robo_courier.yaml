mission:
  title: "Алгоритм навигации «Робо-курьер»"
  description: >-
    На поле 5×5 (клетки А1-Е5) старт робота — А1, финиш (фишка пиццы) —
    Е5. "Запрограммируй" робота карточками команд (Вперёд, Налево,
    Направо, Пауза), чтобы он объехал препятствия и довёз груз, не
    коснувшись их. Три маршрута нарастающей сложности.
  instructions: >-
    Маршрут 1 «Базовая доставка» (низкая сложность). Препятствия:
    2 коробки на клетках В2 и D4. Алгоритм: Вперёд×3 → Направо →
    Вперёд×3 → Налево → Вперёд×1.

    Маршрут 2 «Городские препятствия» (средняя сложность). Препятствия:
    3 коробки на В1, С3, D5; светофор на С4 (требует команды «Пауза»).
    Алгоритм: Вперёд×2 → Налево → Вперёд×2 → Направо → Вперёд×2 → Пауза
    (на светофоре) → Направо → Вперёд×2 → Налево → Вперёд×1.

    Маршрут 3 «Хрупкий груз и оптимизация» (высокая сложность).
    Препятствия: 4 коробки на А3, С2, D4, Е2 (создают узкие коридоры);
    зарядная станция на В4 (обязательно заехать); зона ремонта на С3
    (проезд запрещён). Ограничение «Хрупкий груз»: развороты на 180°
    (Направо + Направо подряд) запрещены. Алгоритм: Вперёд → Направо →
    Вперёд → Вперёд → Вперёд → Вперёд → Налево → Вперёд → Вперёд →
    Вперёд.

    Выбери один маршрут по своим силам, разложи карточки команд в ряд и
    проведи робота по полю строго по ним. Сфотографируй поле, когда робот
    стоит на финише (Е5), а ряд карточек-команд выложен рядом без
    пропусков.
  validation_type: photo
  achievement: algorithmic_navigator

achievements:
