# Source: квест-задания.docx, СЕКТОР 1 «ФИНСТАРТАП 2.0», КАРТОЧКА 2
# «АВИТО-ХАКЕР»

sector:
  slug: finstartup-2-0
  title: "Финстартап 2.0"
  description: >-
    Ты — молодой предприниматель. Твоя цель: заработать первые деньги
    легально и выстроить устойчивую финансовую стратегию.
  color: "Неоново-бирюзовый"
  color_token: "#2DE1C2"
  sort_order: 1

achievements:
  - key: safe_deals
    title: "Безопасные сделки"
    is_badge: false
  - key: scam_recognition
    title: "Распознавание мошеннических схем"
    is_badge: false
  - key: fact_checking_documents
    title: "Фактчекинг и проверка документов"
    is_badge: false
  - key: avito_hacker
    title: "Авито-хакер"
    is_badge: true

card:
  number: 2
  title: "Авито-хакер"
  intro_text: >-
    Продаешь старые вещи на Авито. Нужно не потерять товар и не попасть на
    мошенников.
  qr_token: "finstartup-2-0-02"
  master_code_letter: "В"
  master_code_position: 2

quest:
  title: "Авито-хакер"

nodes:
  - key: stage1
    message: >-
      Продал приставку за 5000 ₽. Покупатель пишет: «Переведу деньги,
      отправьте СДЭК сначала. Доверие есть?»
    choices:
      - label: "A"
        text: "Отправить без оплаты"
        outcome: negative
        consequence_text: >-
          Отправил. Покупатель исчез. Потерял и приставку, и деньги.
          Классический скам.
        status_label: "Жертва мошенничества"
        lesson_text: "Никогда не отправляй товар без оплаты."
        next: stage2
      - label: "B"
        text: "Только предоплата или личная встреча"
        outcome: positive
        consequence_text: >-
          Правильно! Встретились в людном месте, проверили, оплатили.
          Сделка состоялась.
        achievement: safe_deals
        unlock_title: "Чек-лист «Как безопасно продавать на Авито»"
        next: stage2
      - label: "C"
        text: "Попросить паспортные данные"
        outcome: negative
        consequence_text: >-
          Прислал фото чужого паспорта. Если бы отправил товар — стал бы
          соучастником мошенничества.
        status_label: "На грани правонарушения"
        lesson_text: "Не собирай персональные данные."
        next: stage2

  - key: stage2
    message: >-
      Продал кроссовки за 2000 ₽. Покупатель: «Я за границей, переведу
      через Western Union другу в Москве. Вот адрес…»
    choices:
      - label: "A"
        text: "Всё нормально, главное деньги"
        outcome: negative
        consequence_text: >-
          Ты отправил товар другу в Москве. Через неделю приходит
          уведомление от банка: «Перевод отменён. Карта, с которой был
          сделан перевод, украдена». Ты потерял и кроссовки, и деньги.
          Western Union не защищает продавцов!
        status_label: "Жертва международного скама"
        lesson_text: >-
          Western Union — только для получения денег лично, не для
          онлайн-покупок.
        next: stage3
      - label: "B"
        text: "Western Union + друг в Москве + «я за границей» = скам"
        outcome: positive
        consequence_text: >-
          Идеально! Это 100% скам. Схема: тебе приходит фейковое письмо от
          Western Union. Ты отправляешь товар. Оказывается, перевода не
          было — или ещё хуже: тебе реально переводят деньги с украденной
          карты, и потом полиция приходит к тебе как к получателю краденых
          средств.
        achievement: scam_recognition
        unlock_title: "Гайд «Топ-10 схем мошенников на Авито»"
        lesson_text: "Западные переводы + друг = скам."
        next: stage3
      - label: "C"
        text: "Попрошу скриншот перевода"
        outcome: positive
        consequence_text: >-
          Покупатель прислал скриншот. Но при ближайшем рассмотрении
          видно: сумма не совпадает, дата старая, логотип Western Union
          размытый. Это фотошоп! Покупатель пытался тебя обмануть. Ты
          избежал потери товара.
        achievement: fact_checking_documents
        unlock_title: "Чек-лист «Как распознать фейковый скриншот перевода»"
        lesson_text: "Всегда проверяй скриншоты на подлинность."
        next: stage3

  - key: stage3
    message: >-
      Ты продал 3 вещи: приставку (5000 ₽), кроссовки (2000 ₽), старые
      игры (3000 ₽). Итого: 10 000 ₽. Но ты забыл учесть: комиссию Авито
      5%, упаковку и доставку 500 ₽, время на общение с покупателями —
      5 часов. Сколько ты реально заработал?
    choices:
      - label: "A"
        text: "10 000 ₽"
        outcome: negative
        consequence_text: >-
          Ты посчитал только выручку, но не расходы. На самом деле:
          комиссия Авито 5% = 500 ₽, упаковка и доставка = 500 ₽, а ещё
          твоё время (5 часов) тоже стоит денег! Реальная прибыль гораздо
          меньше. Всегда считай полную себестоимость!
        status_label: "Финансовая невнимательность"
        lesson_text: "Выручка ≠ Прибыль. Считай все расходы!"
        next: completion
      - label: "B"
        text: "10 000 − 500 (комиссия) − 500 (упаковка) = 9000 ₽"
        outcome: negative
        consequence_text: >-
          Ты учёл комиссию и упаковку, но забыл про своё время! 5 часов
          общения с покупателями, встречи, упаковка — это тоже работа.
          Если бы ты работал за 200 ₽/час, это ещё 1000 ₽ расходов.
        status_label: "Частичный учёт расходов"
        lesson_text: "Время = деньги. Не забывай учитывать свои трудозатраты!"
        next: completion
      - label: "C"
        text: >-
          10 000 − 500 (комиссия) − 500 (упаковка) − 1000 (5 часов ×
          200 ₽/час) = 8000 ₽
        outcome: positive
        consequence_text: >-
          Молодец! Ты посчитал не только деньги, но и своё время. Реальная
          прибыль — 8000 ₽. Это важно понимать: если тратить слишком много
          времени на продажу дешёвых вещей, это невыгодно. Иногда лучше
          просто отдать вещь даром!
        achievement: avito_hacker
        unlock_title: >-
          Шаблон «Калькулятор прибыли для продаж на Авито»
          (Excel/Google Sheets)
        lesson_text: "Считай выручку, расходы И время."
        next: completion

  - key: completion
    type: completion
    message: >-
      Поздравляю! Ты прошёл карточку "Авито-хакер". Ты научился видеть
      скрытые риски, проверять покупателей и считать реальную прибыль,
      учитывая своё время.
    achievement: avito_hacker
    unlock_title: >-
      Шаблон «Калькулятор прибыли для продаж на Авито» (Excel/Google Sheets)

start_node: stage1
