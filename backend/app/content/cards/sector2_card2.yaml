# Source: квест-задания.docx, СЕКТОР 2 «КИБЕРЩИТ», КАРТОЧКА 2
# «СКАМ В DISCORD»

sector:
  slug: kibershchit
  title: "КиберЩит"
  description: >-
    Ты — кибердетектив. Расследуешь цифровые преступления и защищаешь себя
    и близких.
  color: "Неоново-оранжевый"
  color_token: "#FF7A2D"
  sort_order: 2

achievements:
  - key: source_checking
    title: "Проверка источников"
    is_badge: false
  - key: fact_checking
    title: "Фактчекинг"
    is_badge: false
  - key: manipulation_recognition
    title: "Распознавание манипуляций"
    is_badge: false
  - key: antiphishing
    title: "Антифишинг"
    is_badge: true
  - key: domain_checking
    title: "Проверка доменов"
    is_badge: false
  - key: cyber_citizenship
    title: "Кибергражданственность"
    is_badge: false
  - key: fighting_cybercrime
    title: "Борьба с киберпреступностью"
    is_badge: false

card:
  number: 2
  title: "Скам в Discord"
  intro_text: "Предлагают бесплатный Nitro/валюту. Это ловушка."
  qr_token: "kibershchit-02"
  master_code_letter: "О"
  master_code_position: 6

quest:
  title: "Скам в Discord"

nodes:
  - key: stage1
    message: >-
      В Discord пишет «админ»: «🎁 Бесплатный Nitro! Перейди по ссылке,
      введи карту для подтверждения». Ссылка: disc0rd-nitro.com.
    choices:
      - label: "A"
        text: "Ввожу данные"
        outcome: negative
        consequence_text: >-
          Кардеры! С твоей карты (или карты родителей, если ты её
          использовал) списали 5000 ₽. «Бесплатный» Nitro оказался
          фишинговым сайтом, который украл данные карты. Банк заблокировал
          карту, но деньги уже вывели. Возврат возможен только через
          2 недели расследования, и то не гарантирован.
        status_label: "Жертва кардинга"
        lesson_text: >-
          Бесплатный сыр только в мышеловке. Если просят данные карты для
          «бесплатного» подарка — это 100% скам.
        next: stage2
      - label: "B"
        text: "Пишу настоящему админу"
        outcome: positive
        consequence_text: >-
          Отлично! Ты зашёл на официальный сайт Discord (discord.com),
          нашёл раздел поддержки и написал в чат. Настоящий админ ответил
          через 5 минут: «Это фишинг! Discord никогда не раздаёт Nitro
          через личные сообщения и не просит данные карты. Мы заблокируем
          этот аккаунт». Ты избежал потери денег.
        achievement: source_checking
        unlock_title: >-
          Чек-лист «Как отличить официальный аккаунт Discord от подделки»
          (PDF)
        lesson_text: >-
          Всегда проверяй информацию через официальные каналы, а не через
          ссылки из личных сообщений.
        next: stage2
      - label: "C"
        text: "Гуглю «disc0rd-nitro scam»"
        outcome: positive
        consequence_text: >-
          Мудро! Первые 3 результата в гугле (яндексе): «SCAM», «Fraud»,
          «Don't click!». Ты нашёл отзывы таких же подростков, которые
          попались. Один из них написал: «Потерял 3000 ₽, карта
          заблокирована». Ссылка ведёт на сайт-клон, который ворует данные
          карт. Ты спасён!
        achievement: fact_checking
        unlock_title: >-
          Гайд «Как гуглить, чтобы не попасться на скам» + Список
          проверенных сайтов для проверки ссылок (VirusTotal, Whois)
        lesson_text: "Гугл — твой лучший друг при подозрительных предложениях."
        next: stage2

  - key: stage2
    message: >-
      Ты избежал скама. Но давай разберём, почему это был фишинг, чтобы ты
      мог распознавать такие схемы в будущем. Признаки: 1) домен
      disc0rd-nitro.com (ноль вместо буквы O), 2) письмо пришло в ЛС, а не
      от официального аккаунта Discord, 3) обещают «бесплатно», но просят
      данные карты, 4) срочность: «Предложение действует 10 минут!».
      Какой признак самый подозрительный?
    choices:
      - label: "A"
        text: "Срочность — настоящие акции не торопят"
        outcome: positive
        consequence_text: >-
          Верно! Срочность — это классический приём мошенников. Они
          создают искусственный дефицит времени, чтобы ты не успел
          подумать и принял импульсивное решение. Настоящие компании дают
          время на размышление. Но помни: все четыре признака — красные
          флаги!
        achievement: manipulation_recognition
        lesson_text: "Если тебя торопят — это подозрительно. Возьми паузу, подумай, посоветуйся."
        next: stage3
      - label: "B"
        text: "Просьба данных карты — это всегда скам"
        outcome: positive
        consequence_text: >-
          Именно! Это самый главный красный флаг. Настоящие компании
          НИКОГДА не просят данные карты для «подтверждения» бесплатного
          подарка. Если просят карту — это скам. Запомни это навсегда!
        achievement: antiphishing
        unlock_title: >-
          Чек-лист «7 признаков фишинговой ссылки» (PDF) + Инфографика
          «Красные флаги скама»
        lesson_text: "Карта + «бесплатно» = 100% скам. Это железное правило."
        next: stage3
      - label: "C"
        text: "Странный домен — подделка под бренд"
        outcome: positive
        consequence_text: >-
          Точно! Мошенники часто используют опечатки в доменах: disc0rd
          вместо discord, g00gle вместо google, vk-login вместо vk.com.
          Всегда проверяй адресную строку браузера. Но помни: даже
          правильный домен не гарантирует безопасность — смотри на все
          признаки вместе!
        achievement: domain_checking
        unlock_title: >-
          Гайд «Как читать доменные имена и находить подделки» +
          Расширение для браузера для проверки сайтов
        lesson_text: "Одна буква может изменить всё. Всегда проверяй URL."
        next: stage3

  - key: stage3
    message: >-
      Ты избежал скама и разобрался в механике фишинга. Но твои друзья
      могут попасться. Что сделаешь?
    choices:
      - label: "A"
        text: "Ничего — сами разберутся, это их ответственность"
        outcome: negative
        consequence_text: >-
          Твои друзья поверили и ввели данные карт. 3 человека потеряли по
          2000-5000 ₽. Ты мог их спасти одним сообщением, но промолчал.
          Кибербезопасность — это коллективная ответственность. Когда ты
          знаешь об угрозе и молчишь, ты становишься соучастником.
        status_label: "Равнодушный"
        lesson_text: >-
          Если ты знаешь об угрозе и можешь предупредить — сделай это.
          Молчание делает тебя соучастником.
        next: completion
      - label: "B"
        text: "Предупреждаю друзей в чате: «Не кликайте, это скам!»"
        outcome: positive
        consequence_text: >-
          Твои друзья спасибо сказали! Один уже успел кликнуть по ссылке,
          но после твоего сообщения не ввёл данные карты. Ты спас 3000 ₽!
          Герой дня. Кибербезопасность — это командная работа.
        achievement: cyber_citizenship
        unlock_title: >-
          Шаблон сообщения для предупреждения друзей о скаме + Значок
          «Защитник сообщества» в профиле PWA
        lesson_text: >-
          Предупредить друзей — это 30 секунд, которые могут спасти их
          деньги.
        next: completion
      - label: "C"
        text: "Жалуюсь на аккаунт мошенника в поддержку Discord"
        outcome: positive
        consequence_text: >-
          Отлично! Ты нажал кнопку «Пожаловаться» на аккаунте мошенника и
          описал ситуацию. Поддержка Discord заблокировала аккаунт через
          2 часа. Ты спас десятки подростков, которые могли попасться.
          Поддержка поблагодарила тебя и прислала значок «Trusted
          Reporter» (Надёжный сообщитель).
        achievement: fighting_cybercrime
        unlock_title: >-
          Гайд «Как правильно жаловаться на мошенников в Discord» + Значок
          «Trusted Reporter» в профиле PWA
        lesson_text: "Жалоба — это не ябедничество, а защита сообщества."
        next: completion

  - key: completion
    type: completion
    message: >-
      Поздравляю! Ты прошёл карточку "Скам в Discord". Ты научился
      распознавать фишинг по красным флагам, проверять источники и
      защищать своё сообщество от мошенников.
    achievement: antiphishing
    unlock_title: >-
      Чек-лист «7 признаков фишинговой ссылки» + Гайд «Как правильно
      жаловаться на мошенников в Discord» + Значок «Защитник сообщества» в
      профиле

start_node: stage1
