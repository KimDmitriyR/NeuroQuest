# Source: квест-задания.docx, СЕКТОР 1 «ФИНСТАРТАП 2.0», КАРТОЧКА 4
# «КАРМАННЫЕ ДЕНЬГИ И БЮДЖЕТ»
#
# master_code_letter: source text says "Т" from a different phrase
# ("СОЗДАЙ СВОЙ ПУТЬ"), contradicting every other card and the grand
# finale text (all spell "ТВОЙ НОВЫЙ КОД"). Confirmed a typo with the
# project owner; position 4 of that phrase is "Й", used below.

sector:
  slug: finstartup-2-0
  title: "Финстартап 2.0"
  description: >-
    Ты — молодой предприниматель. Твоя цель: заработать первые деньги
    легально и выстроить устойчивую финансовую стратегию.
  color: "Неоново-бирюзовый"
  color_token: "#2DE1C2"
  sort_order: 1

achievements:
  - key: budgeting
    title: "Бюджетирование"
    is_badge: false
  - key: emergency_fund_management
    title: "Управление форс-мажорами"
    is_badge: false
  - key: investing_basics
    title: "Основы инвестирования"
    is_badge: false
  - key: financial_strategist
    title: "Финансовый стратег"
    is_badge: true

card:
  number: 4
  title: "Карманные деньги и бюджет"
  intro_text: >-
    Получаешь 2000 ₽ в месяц. Нужно научиться управлять, чтобы хватало на
    всё.
  qr_token: "finstartup-2-0-04"
  master_code_letter: "Й"
  master_code_position: 4

quest:
  title: "Карманные деньги и бюджет"

nodes:
  - key: stage1
    message: "1 сентября. Ты получил 2000 ₽ карманных. Впереди целый месяц. Что купишь?"
    choices:
      - label: "A"
        text: "В первый же день куплю чипсы, газировку и новую игрушку за 1500 ₽"
        outcome: negative
        consequence_text: >-
          Ты всё потратил в первый день. Остальные 29 дней: одноклассники
          идут в кино — ты не можешь, хочется перекусить на перемене —
          денег нет, приходится занимать у друзей. Ты стал «должником» на
          целый месяц.
        status_label: "Импульсивный spender (транжира)"
        lesson_text: "Импульсивные покупки в начале месяца = проблемы до его конца."
        next: stage2
      - label: "B"
        text: >-
          Разделю: 1000 ₽ отложу в копилку, 1000 ₽ потрачу на мелочи в
          течение месяца
        outcome: neutral
        consequence_text: >-
          Ты отложил 1000 ₽, это хорошо. Но 1000 ₽ на «мелочи» закончились
          уже к 20-му числу. Тебе пришлось просить у родителей деньги на
          день рождения друга или обед в школе, потому что ты не учёл
          ежедневные мелкие расходы.
        status_label: "Частичное планирование"
        lesson_text: >-
          Делить деньги пополам лучше, чем тратить всё, но без детального
          бюджета на ежедневные нужды ты всё равно попадёшь в минус.
        next: stage2
      - label: "C"
        text: >-
          Составлю бюджет: 500 ₽ — снеки, 500 ₽ — развлечения, 1000 ₽ —
          копилка на большую покупку
        outcome: positive
        consequence_text: >-
          Отлично! Ты распределил деньги: 500 ₽ на снеки (125 ₽/неделю),
          500 ₽ на развлечения, 1000 ₽ в копилку. Через 3 месяца у тебя
          накопилось 3000 ₽ — можно купить что-то серьёзное. При этом ты
          не отказывал себе в мелких радостях каждую неделю!
        achievement: budgeting
        unlock_title: "Шаблон «Бюджет школьника» (Excel/Google Sheets)"
        next: stage2

  - key: stage2
    message: >-
      Ты выбрал правильный путь и отложил 1000 ₽ по бюджету. Но вдруг
      случается форс-мажор: одноклассник зовёт на день рождения (нужен
      подарок 800 ₽) ИЛИ сломался пенал, нужно купить новый (300 ₽). Что
      делаешь?
    choices:
      - label: "A"
        text: "Беру из основной копилки (1000 ₽), потом как-нибудь восполню"
        outcome: negative
        consequence_text: >-
          Ты взял деньги из долгосрочной копилки. Да, проблему ты решил,
          но твоя большая цель (например, новый телефон или игра)
          отодвинулась ещё на месяц. Ты чувствуешь разочарование, потому
          что твой прогресс обнулился.
        status_label: "Разрушитель накоплений"
        lesson_text: >-
          Тратить долгосрочные накопления на сиюминутные форс-мажоры
          убивает финансовую дисциплину.
        next: stage3
      - label: "B"
        text: >-
          Говорю, что денег нет, не иду на день рождения / хожу со
          сломанным пеналом
        outcome: neutral
        consequence_text: >-
          Ты сэкономил деньги, но пожертвовал комфортом или отношениями.
          Друзья немного обиделись, что ты не пришёл, или тебе неудобно
          учиться со сломанным пеналом. Крайняя экономия вредит качеству
          жизни.
        status_label: "Излишняя экономия"
        lesson_text: >-
          Деньги — это инструмент для жизни. Экономить на базовых
          социальных и учебных нуждах — вредно.
        next: stage3
      - label: "C"
        text: >-
          У меня есть «подушка безопасности» — 200-300 ₽ из бюджета на
          снеки/развлечения, которые я не потратил на этой неделе. Беру
          оттуда.
        outcome: positive
        consequence_text: >-
          Мудро! Ты не тронул неприкосновенный запас (копилку), а
          использовал «операционный бюджет» (деньги на снеки/развлечения),
          которые не успел потратить. В следующем месяце ты просто немного
          скорректируешь траты, чтобы восполнить эту сумму. Это и есть
          настоящая «финансовая подушка»!
        achievement: emergency_fund_management
        unlock_title: >-
          Гайд «Как создать подушку безопасности даже с маленьким доходом»
        next: stage3

  - key: stage3
    message: >-
      Прошло 6 месяцев. Ты дисциплинированно откладывал по 1000 ₽ каждый
      месяц. Итого: 6000 ₽. Что сделаешь с этими деньгами?
    choices:
      - label: "A"
        text: "Потрачу всё на одну крутую вещь (новый телефон/консоль)"
        outcome: negative
        consequence_text: >-
          Ты купил крутую вещь. Она радует тебя пару недель, но затем
          деньги заканчиваются. Если завтра снова случится форс-мажор,
          тебе нечем будет его покрыть. Ты снова начинаешь с нуля.
        status_label: "Цикл обнуления"
        lesson_text: >-
          Тратить все накопления — значит оставаться уязвимым перед любыми
          неожиданностями.
        next: completion
      - label: "B"
        text: >-
          3000 ₽ потрачу на радость, 3000 ₽ оставлю лежать «на чёрный
          день»
        outcome: neutral
        consequence_text: >-
          Это безопасный, но не самый эффективный вариант. У тебя есть и
          радость, и запас. Но 3000 ₽ просто лежат «под матрасом».
          Из-за инфляции через год они обесценятся, и на них можно будет
          купить меньше, чем сегодня.
        status_label: "Пассивный накопитель"
        lesson_text: >-
          Просто хранить деньги — значит постепенно их терять из-за
          инфляции. Деньги должны работать.
        next: completion
      - label: "C"
        text: >-
          2000 ₽ потрачу на радость, а 4000 ₽ инвестирую (открою
          накопительный счёт под 10-15% годовых или куплю облигации)
        outcome: positive
        consequence_text: >-
          Идеально! Ты выделил 2000 ₽ на законную награду за свою
          дисциплину. А 4000 ₽ положил на накопительный счёт под 10%
          годовых. Через год ты получишь 4000 + 400 (проценты) = 4400 ₽.
          Твои деньги заработали для тебя, пока ты спал!
        achievement: investing_basics
        unlock_title: >-
          Видео-урок «Что такое сложный процент и как он работает (на
          простых примерах)»
        next: completion

  - key: completion
    type: completion
    message: >-
      Поздравляю! Ты прошёл карточку "Карманные деньги и бюджет". Ты
      научился планировать, защищать свои накопления от форс-мажоров и
      заставлять деньги работать на тебя.
    achievement: financial_strategist

start_node: stage1
