# «АВТОРСКОЕ ПРАВО И ИИ-ХУДОЖНИК»

sector:
  slug: ai-logika
  title: "AI-Логика"
  description: >-
    Ты учишься использовать ИИ с умом: как инструмент, а не как замену
    собственному мышлению.
  color: "Неоново-фиолетовый"
  color_token: "#B14EFF"
  sort_order: 3

achievements:
  - key: ethical_ai_use
    title: "Этичное использование ИИ"
    is_badge: false
  - key: ai_content_critical_analysis
    title: "Критический анализ ИИ-контента"
    is_badge: false
  - key: digital_creator
    title: "Цифровой творец"
    is_badge: true

card:
  number: 3
  title: "Авторское право и ИИ-художник"
  intro_text: "Делаешь логотип для YouTube/ВКвидео через Midjourney/Kandinsky."
  qr_token: "ai-logika-03"
  master_code_letter: "О"
  master_code_position: 11

quest:
  title: "Авторское право и ИИ-художник"

nodes:
  - key: stage1
    message: >-
      Тебе нужен крутой логотип: «Киберпанк кот в неоновых очках». Ты
      генерируешь 10 вариантов в нейросети. Один получается просто космос!
      Но тут ты замечаешь, что стиль, цвета и композиция один в один
      повторяют работы конкретного известного цифрового художника, чьи
      работы ты видел в интернете. Нейросеть обучалась на его картинах без
      его разрешения. Что ты сделаешь с этим изображением?
    choices:
      - label: "A"
        text: "Использую его как есть. Нейросеть же нарисовала, значит, это моё."
        outcome: negative
        consequence_text: >-
          Ты выложил логотип. Через неделю художник видит его и пишет
          гневный пост в соцсетях: «Этот канал украл мой стиль и мою
          работу!». Начинается хейт, твой канал теряет подписчиков, а
          платформа YouTube может удалить контент за нарушение авторских
          прав (Copyright Strike).
        status_label: "Нарушитель авторских прав"
        lesson_text: >-
          ИИ не создаёт из ничего, он компилирует чужие данные.
          Использование чужого стиля без изменений — это плагиат, даже
          если его сделала машина.
        next: stage2
      - label: "B"
        text: "Использую его как референс (идею), но перерисую основные элементы сам"
        outcome: positive
        consequence_text: >-
          Мудрое решение! ИИ дал тебе классную идею композиции и цветов, но
          финальный продукт создан твоими руками (или руками твоей
          команды). Это легально, этично и развивает твои навыки. Художник
          не пострадал, а ты получил уникальный логотип.
        achievement: ethical_ai_use
        unlock_title: >-
          Гайд «Как легально использовать ИИ-арт: референсы, коллажи и
          доработки» + Статья об авторском праве в эпоху ИИ
        lesson_text: >-
          ИИ — это источник вдохновения, а не готовый продукт. Человеческое
          участие делает работу авторской.
        next: stage2
      - label: "C"
        text: "Удалю всё и буду рисовать сам с нуля, без ИИ. Нечестно это как-то."
        outcome: neutral
        consequence_text: >-
          Ты поступил максимально честно, но упустил возможности. Ты
          потратил 5 часов на рисунок, который ИИ мог бы набросать за 5
          минут. В 2026 году умение работать в связке «Человек + ИИ» — это
          базовый навык дизайнера. Полный отказ от ИИ замедляет тебя.
        status_label: "Цифровой пурист"
        lesson_text: >-
          Честность — это хорошо, но полный отказ от новых технологий
          снижает твою продуктивность. Учись использовать ИИ как
          инструмент, а не бойся его.
        next: stage2

  - key: stage2
    message: >-
      Ты решаешь сгенерировать картинку для презентации: «Учёный работает
      за компьютером». Картинка красивая, но при ближайшем рассмотрении ты
      видишь: у учёного 6 пальцев на руке, а на мониторе написан
      бессмысленный набор букв и иероглифов. Почему так произошло?
    choices:
      - label: "A"
        text: "Нейросеть сломалась, нужно перезагрузить компьютер или очистить кэш"
        outcome: neutral
        consequence_text: >-
          Перезагрузка не поможет! Это не баг и не ошибка в программе. Это
          фундаментальная особенность того, как работают диффузионные
          модели. Они не знают, что такое «палец» или «буква», они просто
          генерируют узоры.
        status_label: "Техническое непонимание"
        lesson_text: >-
          ИИ не ломается от таких ошибок. Это его природа. Нужно понимать,
          как работает инструмент, чтобы исправлять его ошибки.
        next: stage3
      - label: "B"
        text: "Нейросети не «понимают» анатомию или текст, они рисуют статистически частые пиксели"
        outcome: positive
        consequence_text: >-
          Точно! ИИ не знает, что такое «палец» или «буква». Он знает, что
          в этом месте картинки часто бывают какие-то линии и закорючки.
          Поэтому всегда проверяй руки, зубы и текст на сгенерированных
          изображениях перед публикацией!
        achievement: ai_content_critical_analysis
        unlock_title: >-
          Чек-лист «7 мест, где ИИ всегда ошибается (руки, текст, глаза,
          логика)» + Гайд по исправлению артефактов в Photoshop
        lesson_text: "ИИ — это статистика, а не понимание. Всегда проверяй результат."
        next: stage3
      - label: "C"
        text: "Это такой художественный стиль, так и было задумано разработчиками"
        outcome: neutral
        consequence_text: >-
          Если ты выдашь это за стиль, тебя не поймут. Зрители увидят в
          этом ошибку. Разработчики не закладывали 6 пальцев как «фишку».
          Это побочный эффект обучения на миллионах картинок, где руки
          часто закрыты или обрезаны.
        status_label: "Иллюзия контроля"
        lesson_text: >-
          Не стоит приписывать ИИ творческий замысел там, где есть только
          математическая погрешность.
        next: stage3

  - key: stage3
    message: >-
      Многие боятся, что ИИ заменит художников, писателей и музыкантов.
      Как ты считаешь, какая главная ценность останется за человеком в
      эпоху ИИ?
    choices:
      - label: "A"
        text: "Умение быстро нажимать кнопки и генерировать тысячи картинок в минуту"
        outcome: neutral
        consequence_text: >-
          В скорости нажатия кнопок человек никогда не обгонит машину. Если
          твоя ценность только в том, чтобы «генерировать много», ИИ
          действительно тебя заменит. Ценность смещается от количества к
          качеству и смыслу.
        status_label: "Конкурент машины"
        lesson_text: "Соревноваться с ИИ в скорости и объёме — проигрышная стратегия."
        next: completion
      - label: "B"
        text: >-
          Умение придумывать оригинальные идеи, ставить задачи (промпты),
          отбирать лучший результат и вкладывать в работу смысл
        outcome: positive
        consequence_text: >-
          Верно! ИИ — это кисть, а не художник. Ценность смещается от
          «технического исполнения» к «креативному замыслу», вкусу и
          эмпатии. ИИ не умеет чувствовать боль, радость или сарказм, он
          только имитирует. Тот, кто умеет управлять ИИ и вкладывать в
          работы душу, заменит того, кто не умеет.
        achievement: digital_creator
        unlock_title: >-
          Видео-интервью «Как современные дизайнеры работают с ИИ и не
          теряют работу» + Статья о профессиях будущего
        lesson_text: "ИИ забирает рутину, освобождая время для настоящего творчества и стратегии."
        next: completion
      - label: "C"
        text: "Никакая, ИИ скоро сделает всё лучше человека, и людям останется только смотреть"
        outcome: negative
        consequence_text: >-
          Это поражение до начала битвы. ИИ создаёт контент, но люди
          потребляют контент, созданный людьми, потому что нам важна
          история автора. Мы читаем книги, чтобы понять другого человека, а
          не набор алгоритмов. Полная замена человека невозможна, изменится
          только форма сотрудничества.
        status_label: "Техно-пессимист"
        lesson_text: >-
          Технологии меняют инструменты, но не отменяют потребность в
          человеческом общении и эмпатии.
        next: completion

  - key: completion
    type: completion
    message: >-
      Поздравляю! Ты прошёл карточку "Авторское право и ИИ-художник". Ты
      умеешь использовать ИИ как источник вдохновения, сохраняя авторский
      контроль, понимаешь его технические ограничения и видишь свою
      ценность в эпоху алгоритмов.
    achievement: digital_creator

start_node: stage1
