# Source: квест-задания.docx, СЕКТОР 2 «КИБЕРЩИТ», КАРТОЧКА 1
# «ВЗЛОМ АККАУНТА»
#
# Color hex is a placeholder pick for "Неоново-оранжевый" (no hex given in
# the source), same caveat as sector 1's color.

sector:
  slug: kibershchit
  title: "КиберЩит"
  description: >-
    Ты — кибердетектив. Расследуешь цифровые преступления и защищаешь себя
    и близких.
  color: "Неоново-оранжевый"
  color_token: "#FF7A2D"
  sort_order: 2

achievements:
  - key: cyber_hygiene
    title: "Кибергигиена"
    is_badge: false
  - key: digital_forensics
    title: "Цифровая криминалистика"
    is_badge: false
  - key: two_fa_master
    title: "2FA-мастер"
    is_badge: false
  - key: cyber_defense
    title: "Киберзащита"
    is_badge: true

card:
  number: 1
  title: "Взлом аккаунта"
  intro_text: >-
    Аккаунт в Discord/Steam взломали. Друг пишет: «Твой аккаунт рассылает
    спам!»
  qr_token: "kibershchit-01"
  master_code_letter: "Н"
  master_code_position: 5

quest:
  title: "Взлом аккаунта"

nodes:
  - key: stage1
    message: "Тебя выкинуло из аккаунта. Что делаешь ПРЯМО СЕЙЧАС?"
    choices:
      - label: "A"
        text: "Пишу в поддержку"
        outcome: neutral
        consequence_text: >-
          Ждал ответа 3 дня. Хакер удалил сохранения, разослал вирусы,
          выложил компромат. Доступ вернули, но репутация подмочена.
        status_label: "Запоздалая реакция"
        lesson_text: "Скорость реакции критична!"
        next: stage2
      - label: "B"
        text: "Иду к родителям/другу за помощью"
        outcome: positive
        consequence_text: >-
          Правильно! Вместе сменили пароли, включили 2FA, проверили ПК,
          предупредили друзей. Хакер не успел ничего украсть.
        achievement: cyber_hygiene
        unlock_title: "Инструкция «Экстренный план при взломе»"
        next: stage2
      - label: "C"
        text: "Пытаюсь подобрать пароль сам"
        outcome: negative
        consequence_text: >-
          Пытался подобрать пароль 2 часа. Хакер взломал почту и ещё 3
          аккаунта. Потерял контроль над всеми профилями.
        status_label: "Паникер"
        lesson_text: "Не паникуй, действуй по алгоритму."
        next: stage2

  - key: stage2
    message: >-
      Аккаунт вернули. Улики: фишинговое письмо, IP-адрес, странный
      никнейм в друзьях.
    choices:
      - label: "A"
        text: "Пишу хакеру"
        outcome: negative
        consequence_text: >-
          Ты написал хакеру. Он ответил: «Сам кликнул на ссылку 😂». И
          заблокировал тебя. Ты ничего не добился, только потратил время
          и эмоциональные силы. Хакеры не ведут диалоги с жертвами — они
          их используют.
        status_label: "Наивный мститель"
        lesson_text: >-
          Не вступай в контакт со злоумышленниками. Это только даёт им
          информацию о тебе и тратит твоё время.
        next: stage3
      - label: "B"
        text: "Сохраняю скриншоты, передаю в «киберполицию»"
        outcome: positive
        consequence_text: >-
          Отлично! Сохранил доказательства. «Киберполиция» приняла
          заявление. Хакера нашли (одноклассник), поставили на учёт.
        achievement: digital_forensics
        unlock_title: "Гайд «Как правильно собрать доказательства киберпреступления»"
        next: stage3
      - label: "C"
        text: "Ищу его по IP-адресу сам"
        outcome: negative
        consequence_text: >-
          Попытался «пробить» IP через сайты-мошенники. Купил фейковую
          информацию и нарушил закон о персональных данных. Из жертвы
          превратился в правонарушителя.
        status_label: "Самоуправец"
        lesson_text: "Расследование — дело профессионалов."
        next: stage3

  - key: stage3
    message: "Как защититься в будущем?"
    choices:
      - label: "A"
        text: "Сложный пароль в блокноте"
        outcome: neutral
        consequence_text: >-
          Пароль хороший, но блокнот — плохая идея. Если его найдут
          (родители, друзья, уборщица), все твои пароли украдут. А если
          потеряешь блокнот — сам не войдёшь в аккаунты. Это как хранить
          ключи от квартиры под ковриком.
        status_label: "Частичная защита"
        lesson_text: >-
          Менеджер паролей (Bitwarden, 1Password) надёжнее блокнота. Он
          шифрует данные и доступен только тебе.
        next: completion
      - label: "B"
        text: "Двухфакторная аутентификация (2FA) через приложение"
        outcome: positive
        consequence_text: >-
          Идеально! Даже если хакер узнает пароль, без кода из приложения
          (который меняется каждые 30 секунд) он не войдёт. Это как замок
          + сигнализация + охранник. Твой аккаунт теперь защищён на 99%.
          Даже утечка пароля из базы данных сервиса не даст хакеру доступ.
        achievement: two_fa_master
        unlock_title: >-
          Видео-урок «Как настроить 2FA на всех популярных сервисах» +
          Список лучших приложений-аутентификаторов
        lesson_text: >-
          Двухфакторная аутентификация — это базовая гигиена цифрового
          мира в 2026 году.
        next: completion
      - label: "C"
        text: "Менять пароль каждый месяц"
        outcome: neutral
        consequence_text: >-
          Частая смена паролей — это миф о безопасности, который устарел
          лет на 10. Если пароль слабый, его взломают за минуту. Если
          сильный и с 2FA — можно не менять годами. Ты потратил время
          впустую, а главное — не закрыл основную уязвимость (отсутствие
          2FA).
        status_label: "Ложная безопасность"
        lesson_text: >-
          Качество важнее частоты. Один сильный пароль + 2FA лучше, чем
          12 слабых паролей без защиты.
        next: completion

  - key: completion
    type: completion
    message: >-
      Поздравляю! Ты прошёл карточку "Взлом аккаунта". Ты знаешь алгоритм
      действий при взломе: не паниковать, привлечь взрослых, сохранить
      улики, передать в киберполицию и включить двухфакторную защиту.
    achievement: cyber_defense
    unlock_title: >-
      Инструкция «Экстренный план при взломе» + Список надёжных приложений
      для 2FA + Гайд «Как правильно собрать доказательства
      киберпреступления»

start_node: stage1
