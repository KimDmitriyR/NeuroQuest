# Source: квест-задания.docx, СЕКТОР 3 «AI-ЛОГИКА», КАРТОЧКА 1
# «ГАЛЛЮЦИНАЦИЯ НЕЙРОСЕТИ»
#
# Color hex is a placeholder pick for "Неоново-фиолетовый" (no hex given in
# the source, same as sector 3's other card already seeded via missions).

sector:
  slug: ai-logika
  title: "AI-Логика"
  description: >-
    Ты учишься использовать ИИ с умом: как инструмент, а не как замену
    собственному мышлению.
  color: "Неоново-фиолетовый"
  color_token: "#B14EFF"
  sort_order: 3

achievements:
  - key: ai_as_assistant
    title: "ИИ как ассистент"
    is_badge: false
  - key: ai_content_factchecking
    title: "Фактчекинг ИИ-контента"
    is_badge: false
  - key: prompt_engineering_stage
    title: "Промпт-инженерия"
    is_badge: false
  - key: prompt_engineer_badge
    title: "Промпт-инженер"
    is_badge: true

card:
  number: 1
  title: "Галлюцинация нейросети"
  intro_text: >-
    Нужно сделать доклад за 30 минут. Нейросеть предлагает помощь, но умеет
    уверенно врать.
  qr_token: "ai-logika-01"
  master_code_letter: "Й"
  master_code_position: 9

quest:
  title: "Галлюцинация нейросети"

nodes:
  - key: stage1
    message: >-
      Завтра сдавать доклад на тему «Изобретение первого компьютера». У
      тебя есть только 30 минут. Ты открываешь нейросеть и пишешь промпт:
      «Напиши доклад на 2 страницы про изобретение компьютера». Через 10
      секунд текст готов. Он звучит умно, есть даты и имена. Но
      учительница истории известна тем, что ловит на списывании. Что
      делаешь?
    choices:
      - label: "A"
        text: "Копирую весь текст и сдаю как свой. Нейросеть же умная, она не ошибается!"
        outcome: negative
        consequence_text: >-
          Ты сдаёшь доклад. Учительница читает и улыбается: «Очень
          интересно. А правда ли, что первый компьютер изобрёл Наполеон в
          1812 году?» Ты в шоке проверяешь текст. Нейросеть сгенерировала
          этот факт «из головы» (это называется галлюцинация). Оценка: 2.
          И разговор с директором о списывании.
        status_label: "Жертва галлюцинации ИИ"
        lesson_text: >-
          Нейросети не «знают» факты, они предсказывают следующее слово на
          основе статистики. Они могут уверенно врать, особенно про даты и
          имена.
        next: stage2
      - label: "B"
        text: "Прошу нейросеть сделать только план доклада, а факты и выводы пишу сам"
        outcome: positive
        consequence_text: >-
          Отличный подход! Нейросеть дала структуру: 1) Аналитическая
          машина Чарльза Бэббиджа (1837), 2) ЭНИАК — первый электронный
          компьютер (1945), 3) Персональные компьютеры (1970-е). Ты сам
          проверил даты в учебнике, добавил свои выводы про влияние на
          современность. Учительница поставила 5, отметив глубокое
          понимание темы и оригинальный стиль.
        achievement: ai_as_assistant
        unlock_title: >-
          Гайд «Как использовать ИИ для учёбы, а не для списывания» +
          Шаблон «Правильный промпт для учебных задач»
        lesson_text: >-
          ИИ — отличный помощник для структуры и идей, но факты и выводы
          должны быть твоими.
        next: stage2
      - label: "C"
        text: "Прошу нейросеть «сделать текст более человечным, чтобы антиплагиат не понял»"
        outcome: neutral
        consequence_text: >-
          Нейросеть перефразировала текст, добавив странные слова («таким
          образом», «в современном мире», «является актуальным»).
          Антиплагиат показал 80% заимствований, а учительница сразу
          увидела неестественный, «роботизированный» стиль. Ты получил 3 и
          предупреждение о списывании. Современные системы проверки
          ИИ-текста становятся всё умнее.
        status_label: "Неудачный обход"
        lesson_text: >-
          Обойти системы проверки становится всё сложнее. Качество
          «замаскированного» текста падает, а риск быть пойманным растёт.
        next: stage2

  - key: stage2
    message: >-
      Давай научимся проверять ИИ. Нейросеть выдала такой факт: «Первая
      компьютерная программа была написана Адой Лавлейс в 1843 году для
      аналитической машины, и она содержала 1000 строк кода на языке
      Python». Найди ошибку в этом утверждении.
    choices:
      - label: "A"
        text: "Ошибка в дате (1843 год)"
        outcome: neutral
        consequence_text: >-
          Дата 1843 год — верная! Ада Лавлейс действительно написала свою
          программу в 1843 году. Но в утверждении есть другая, более
          грубая ошибка. Подумай ещё раз.
        status_label: "Частичная проверка"
        lesson_text: >-
          При проверке фактов нужно анализировать всё утверждение целиком,
          а не цепляться за одну деталь.
        next: stage3
      - label: "B"
        text: "Ошибка в имени (программу написал Чарльз Бэббидж)"
        outcome: neutral
        consequence_text: >-
          Неверно! Программу действительно написала Ада Лавлейс, а не
          Чарльз Бэббидж. Бэббидж создал машину, а Лавлейс написала для
          неё алгоритм. Но в утверждении есть другая ошибка. Подумай ещё
          раз.
        status_label: "Историческая путаница"
        lesson_text: >-
          Ада Лавлейс — первая в мире программистка. Чарльз Бэббидж —
          создатель аналитической машины. Не путай их роли!
        next: stage3
      - label: "C"
        text: "Ошибка в языке программирования (Python не существовал в 19 веке)"
        outcome: positive
        consequence_text: >-
          Верно! Python был создан в 1991 году Гвидо ван Россумом. Ада
          Лавлейс написала первую программу в 1843 году, но это были
          алгоритмы для механической машины, а не код на современном
          языке. Нейросеть смешала реальные факты с выдумкой. Это
          классическая галлюцинация!
        achievement: ai_content_factchecking
        unlock_title: >-
          Чек-лист «Как проверить факт, сгенерированный ИИ» + Список
          надёжных источников для проверки (Википедия, учебники, научные
          статьи)
        lesson_text: >-
          Всегда проверяй даты, имена и технические детали, которые выдаёт
          ИИ. Особенно про историю и технологии.
        next: stage3

  - key: stage3
    message: >-
      Ты понял, что ИИ нужно правильно «кормить» информацией. Как должен
      звучать идеальный промпт для написания доклада, чтобы получить
      качественный и правдивый результат?
    choices:
      - label: "A"
        text: "«Напиши крутой доклад по истории, чтобы учительница офигела»"
        outcome: neutral
        consequence_text: >-
          Такой промпт слишком размыт. Нейросеть не понимает, что такое
          «крутой» и «офигела». Она напишет что-то общее, возможно, с
          галлюцинациями. Чем точнее промпт, тем лучше результат. «Крутой»
          — это не критерий качества для ИИ.
        status_label: "Размытый промпт"
        lesson_text: >-
          ИИ не понимает эмоции и сленг. Ему нужны конкретные инструкции:
          тема, стиль, ограничения, требования.
        next: completion
      - label: "B"
        text: >-
          «Напиши доклад про изобретение компьютера. Используй только
          проверенные факты. Укажи источники. Стиль: ученик 8 класса»
        outcome: positive
        consequence_text: >-
          Идеально! Ты задал: 1) роль (ученик 8 класса), 2) ограничение
          (только проверенные факты), 3) требование (указать источники),
          4) стиль (школьный доклад). Такой промпт резко снижает шанс
          галлюцинации. ИИ понимает, что нужно писать просто, с
          источниками и без выдумок. Это профессиональный подход!
        achievement: prompt_engineering_stage
        unlock_title: >-
          Конструктор идеальных промптов (шаблон) + Гайд «10 формул
          промптов для учебных задач»
        lesson_text: >-
          Качество ответа ИИ на 90% зависит от качества твоего вопроса.
          Чем точнее промпт, тем лучше результат.
        next: completion
      - label: "C"
        text: "«Сделай рерайт текста из Википедии, чтобы он был уникальным»"
        outcome: negative
        consequence_text: >-
          Это плохая идея по двум причинам: 1) рерайт чужого текста — это
          плагиат, даже если ты изменил слова, 2) ИИ всё равно может
          добавить галлюцинации при перефразировании. Лучше использовать
          ИИ для структуры и идей, а основной текст писать самому,
          опираясь на источники.
        status_label: "Риск плагиата"
        lesson_text: >-
          Рерайт — это не оригинальная работа. Используй ИИ как помощника,
          а не как замену собственному мышлению.
        next: completion

  - key: completion
    type: completion
    message: >-
      Поздравляю! Ты прошёл карточку "Галлюцинация нейросети". Ты понял,
      что ИИ — это инструмент для структурирования мыслей, а не замена
      твоему мозгу. Факты всегда нужно проверять, а промпты — составлять
      точно.
    achievement: prompt_engineer_badge

start_node: stage1
