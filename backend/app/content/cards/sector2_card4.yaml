card:
  number: 4
  title: "Дипфейк-атака"
  intro_text: >-
    Звонит «мама» с незнакомого номера, просит срочно перевести 50 000 ₽.
    Дипфейк.
  qr_token: "kibershchit-04"
  master_code_letter: "Ы"
  master_code_position: 8

quest:
  title: "Дипфейк-атака"

nodes:
  - key: stage1
    message: >-
      Тебе звонит номер, который ты не знаешь. Ты берёшь трубку, а там —
      ГОЛОС МАМЫ! «Сынок, это я! Я попала в аварию, срочно нужно 50 000 ₽
      на лечение. Переведи на карту 2200 1234 5678 9012. Только никому не
      говори, я в больнице, связи нет. Быстрее!» Голос звучит как мама,
      она волнуется, плачет… Что делаешь?
    choices:
      - label: "A"
        text: "Срочно перевожу деньги — мама же в опасности!"
        outcome: negative
        consequence_text: >-
          Ты перевёл 50 000 ₽ (родительских денег с их карты, к которой у
          тебя был доступ). Через 10 минут звонит настоящая мама: «Ты куда
          деньги перевёл?» Ты в панике объясняешь. Мама вызывает полицию.
          Деньги уже вывели через криптовалюту. Вернуть невозможно. Это
          был дипфейк — нейросеть скопировала голос мамы из видео в
          соцсетях.
        status_label: "Жертва дипфейка"
        lesson_text: >-
          Дипфейки голоса — это реально! Нейросети могут скопировать голос
          за 30 секунд из открытых источников.
        next: stage2
      - label: "B"
        text: "Кладу трубку и перезваниваю маме на её обычный номер"
        outcome: positive
        consequence_text: >-
          Правильно! Ты положил трубку и набрал маму на её обычный номер.
          Она взяла: «Сынок, что случилось?» Ты рассказал. Мама: «Это
          мошенники! У меня всё хорошо, я дома!» Ты избежал потери денег.
          Голос был подделан нейросетью — дипфейк. Мошенники взяли голос
          из твоего видео в TikTok, где ты снимал маму.
        achievement: deepfake_recognition
        unlock_title: >-
          Гайд «Как защитить семью от голосового дипфейка» + Инструкция
          «Что делать, если тебе звонят с просьбой о деньгах»
        lesson_text: >-
          Всегда перезванивай на известный номер, если звонят с
          незнакомого и просят деньги.
        next: stage2
      - label: "C"
        text: "Прошу «маму» назвать кодовое слово (день рождения кота)"
        outcome: positive
        consequence_text: >-
          Мудро! Ты спросил кодовое слово. «Мама» замолчала на 2 секунды:
          «Э… Мурзик, 15 марта». Но настоящий день рождения кота — 20
          апреля! Это мошенник. Ты положил трубку и позвонил настоящей
          маме. Она подтвердила: никто не звонил. Ты избежал потери денег.
        achievement: identity_verification
        unlock_title: >-
          Шаблон «Семейное кодовое слово» (PDF для печати) + Гайд «Как
          договориться с семьёй о проверке личности»
        lesson_text: >-
          Кодовое слово — это как пароль. Только вы знаете. Даже если
          мошенники украдут голос, они не знают слово.
        next: stage2

  - key: stage2
    message: >-
      Как мошенники подделали голос мамы? Они: 1) нашли в соцсетях видео,
      где говорит твоя мама (Instagram, VK, TikTok), 2) загрузили в
      нейросеть (типа ElevenLabs или Resemble AI), 3) склонировали голос
      за 30 секунд, 4) позвонили тебе с поддельного номера (спуфинг). Это
      называется дипфейк (deepfake). Как защититься?
    choices:
      - label: "A"
        text: "Никогда не выкладывать видео с голосом родителей в соцсети"
        outcome: neutral
        consequence_text: >-
          Это хорошая идея, но нереалистичная. В 2026 году почти у всех
          есть видео с голосами близких в соцсетях. Полностью удалить всё
          невозможно. Лучше использовать многоуровневую защиту: кодовое
          слово + перезвон + настройка приватности.
        status_label: "Частичная защита"
        lesson_text: >-
          Удалить все видео невозможно. Лучше использовать активные методы
          проверки (кодовое слово, перезвон).
        next: stage3
      - label: "B"
        text: "Договориться с семьёй о кодовом слове на экстренный случай"
        outcome: positive
        consequence_text: >-
          Идеально! Кодовое слово — это как пароль. Только вы знаете. Даже
          если мошенники украдут голос, они не знают слово. Это работает!
          Дополнительно: не выкладывай много видео с голосом семьи,
          настрой на телефоне «белый список» номеров, если просят деньги —
          всегда перезванивай на известный номер.
        achievement: antideepfake
        unlock_title: >-
          Шаблон «Семейное кодовое слово» (PDF) + Гайд «Настройка белого
          списка номеров» + Видео «Как работают дипфейки»
        lesson_text: >-
          Технологии могут использоваться во вред. Защита — это комбинация
          методов.
        next: stage3
      - label: "C"
        text: "Не брать трубку с незнакомых номеров"
        outcome: neutral
        consequence_text: >-
          Это безопасный, но непрактичный метод. Ты можешь пропустить
          важный звонок (врач, школа, работа родителей). Лучше не
          игнорировать все незнакомые номера, а использовать проверку:
          кодовое слово + перезвон на известный номер.
        status_label: "Излишняя осторожность"
        lesson_text: >-
          Игнорирование всех незнакомых номеров может привести к пропуску
          важных звонков. Лучше использовать активную проверку.
        next: stage3

  - key: stage3
    message: >-
      Ты узнал о дипфейках. Но ведь эту технологию можно использовать и
      хорошо. Например: восстановить голос человека, который потерял речь
      (после инсульта, болезни); создать аудиокнигу голосом умершего
      актёра; перевести фильм на другой язык голосом оригинального актёра;
      озвучить персонажа в игре, если актёр больше не может работать. Где
      грань между хорошим и плохим использованием дипфейков?
    choices:
      - label: "A"
        text: "Дипфейки — это всегда плохо, их нужно запретить"
        outcome: neutral
        consequence_text: >-
          Понятная реакция, но запрет технологии не остановит мошенников —
          они всё равно будут использовать дипфейки в подполье. А хорошие
          люди (врачи, актёры, учёные) потеряют полезный инструмент.
          Запрет не решает проблему, а только создаёт новые.
        status_label: "Категоричный запрет"
        lesson_text: >-
          Запрет технологии не останавливает преступников, но лишает
          общество полезных инструментов. Нужно регулирование, а не
          запрет.
        next: completion
      - label: "B"
        text: "Дипфейки — это инструмент, всё зависит от того, кто использует"
        outcome: positive
        consequence_text: >-
          Правильно! Нож может нарезать хлеб, а может ранить. Дипфейк
          может помочь инвалиду заговорить голосом близкого, а может
          украсть деньги. Важно: всегда проверять источник, не верить
          слепо видео/аудио, использовать технологии ответственно, иметь
          законы против мошенничества. Ты прошёл самый сложный квест про
          дипфейки!
        achievement: digital_ethics
        unlock_title: >-
          Статья «Этичное использование дипфейков: границы дозволенного» +
          Гайд «Как распознать дипфейк (чек-лист)»
        lesson_text: >-
          Технология нейтральна. Всё зависит от того, кто и как её
          использует.
        next: completion
      - label: "C"
        text: "Дипфейки — это круто, пусть все пользуются без ограничений"
        outcome: negative
        consequence_text: >-
          Это опасная позиция. Полная свобода использования дипфейков
          приведёт к хаосу: мошенники будут воровать деньги, политики
          будут подделывать заявления, актёры потеряют контроль над своим
          голосом. Нужны правила и законы, чтобы защитить людей от
          злоупотреблений.
        status_label: "Наивный технооптимист"
        lesson_text: >-
          Технологии без регулирования приводят к злоупотреблениям. Нужен
          баланс между свободой и безопасностью.
        next: completion

  - key: completion
    type: completion
    message: >-
      Поздравляю! Ты прошёл карточку "Дипфейк-атака". Ты знаешь, что голос
      и видео можно подделать, и у тебя есть надёжный метод проверки:
      семейное кодовое слово и перезвон. Ты также понимаешь этическую
      сторону использования дипфейков.
    achievement: cyber_ethics
    unlock_title: >-
      Гайд «Как защитить семью от голосового дипфейка» + Шаблон «Семейное
      кодовое слово» + Статья «Этичное использование дипфейков»

start_node: stage1
