# Source: квест-задания.docx, СЕКТОР 2 «КИБЕРЩИТ», КАРТОЧКА 3
# «КРИПТО-ЛОВУШКА»

sector:
  slug: kibershchit
  title: "КиберЩит"
  description: >-
    Ты — кибердетектив. Расследуешь цифровые преступления и защищаешь себя
    и близких.
  color: "Неоново-оранжевый"
  color_token: "#FF7A2D"
  sort_order: 2

achievements:
  - key: pyramid_recognition
    title: "Распознавание финансовых пирамид"
    is_badge: false
  - key: pyramid_structure_understanding
    title: "Понимание структуры пирамид"
    is_badge: false
  - key: legal_income
    title: "Легальный заработок"
    is_badge: false
  - key: antipyramid
    title: "Антипирамида"
    is_badge: true

card:
  number: 3
  title: "Крипто-ловушка"
  intro_text: >-
    Предлагают «гарантированный» заработок на крипте. Финансовая пирамида.
  qr_token: "kibershchit-03"
  master_code_letter: "В"
  master_code_position: 7

quest:
  title: "Крипто-ловушка"

nodes:
  - key: stage1
    message: >-
      TikTok: «Школьник заработал 100к на крипте за неделю! Вступай в
      закрытый чат». Чат: «Вложи 5000, получи 15 000 через 7 дней.
      Гарантия!»
    choices:
      - label: "A"
        text: "Попрошу у родителей 5000 ₽"
        outcome: positive
        consequence_text: >-
          Родители спросили: «Откуда гарантия?» Ты не смог ответить. Они
          погуглили и показали: это классическая пирамида. Первые
          участники получают деньги от новых. Когда новые кончатся — все
          потеряют. Ты избежал потери 5000 ₽, потому что родители вовремя
          вмешались.
        status_label: "Избежал скама с помощью взрослых"
        unlock_title: >-
          Гайд «Как объяснить родителям, что ты хочешь инвестировать (и не
          попасть на скам)»
        lesson_text: >-
          Гарантия в крипте = красный флаг. Если обещают 200% прибыли за
          неделю — это пирамида.
        next: stage2
      - label: "B"
        text: "Погуглю «крипто пирамида признаки»"
        outcome: positive
        consequence_text: >-
          Отлично! Первая же статья: «Признаки крипто-пирамиды: обещание
          200% прибыли, закрытый чат, реферальная система, отсутствие
          реального продукта». Ты понял — это скам. Скриншоты отправил в
          полицию через форму «Кибердружина». Чат заблокировали через
          3 дня.
        achievement: pyramid_recognition
        unlock_title: >-
          Чек-лист «10 признаков финансовой пирамиды» (PDF) + Форма для
          жалобы в ЦБ РФ
        lesson_text: >-
          Если слишком хорошо, чтобы быть правдой — это скам. Гугл спасает
          деньги.
        next: stage2
      - label: "C"
        text: "Вложу 1000 ₽ (половину)"
        outcome: negative
        consequence_text: >-
          Первые 3 дня тебе начислили «прибыль» 3000 ₽. Ты обрадовался и
          вложил ещё 2000 ₽ (занял у друга). На 7-й день чат исчез, админы
          заблокировали тебя. Ты потерял 3000 ₽ своих и должен другу. Это
          классическая схема: сначала дают «прибыль», чтобы втянуть, потом
          исчезают.
        status_label: "Жертва пирамиды"
        lesson_text: >-
          Пирамиды дают «прибыль» сначала, чтобы втянуть. Никогда не
          вкладывай в то, что не понимаешь.
        next: stage2

  - key: stage2
    message: >-
      Давай разберём, почему это пирамида. Схема: новые участники →
      вкладывают деньги → деньги идут старым участникам → старые получают
      «прибыль» → привлекают новых → … → когда новых нет → все теряют
      деньги. Вопрос: кто в итоге зарабатывает?
    choices:
      - label: "A"
        text: "Все участники"
        outcome: neutral
        consequence_text: >-
          Неверно! В пирамиде 90% участников теряют деньги. Только
          организаторы забирают 30-50% сразу, а первые участники
          (топ-агитаторы) получают деньги от новых. Когда приток новых
          останавливается — пирамида рушится. Это математика, а не теория
          заговора.
        status_label: "Наивный оптимист"
        lesson_text: "Пирамида не может обогатить всех. Это математически невозможно."
        next: stage3
      - label: "B"
        text: "Только организаторы и первые участники"
        outcome: positive
        consequence_text: >-
          Именно! Организаторы забирают 30-50% сразу. Первые участники
          (те, кто привёл много людей) получают деньги от новых. Когда
          приток новых останавливается — пирамида рушится. 90% участников
          теряют деньги. Это математика!
        achievement: pyramid_structure_understanding
        unlock_title: >-
          Видео «Как работают финансовые пирамиды (на примерах МММ, Finiko
          и др.)» + Калькулятор «Сколько реально зарабатывают в пирамидах»
        lesson_text: >-
          Если ты не организатор и не первый участник — ты потеряешь
          деньги.
        next: stage3
      - label: "C"
        text: "Те, кто вложит больше всех"
        outcome: neutral
        consequence_text: >-
          Не совсем так! Размер вклада не важен. Важно, когда ты вошёл.
          Первые участники (даже с маленьким вкладом) могут успеть забрать
          деньги. Последние (даже с большим вкладом) всегда теряют всё.
          Это как музыкальные стулья: когда музыка останавливается, те,
          кто не успел сесть, проигрывают.
        status_label: "Частичное понимание"
        lesson_text: >-
          В пирамидах важен не размер вклада, а время входа. Но даже
          первые участники рискуют.
        next: stage3

  - key: stage3
    message: >-
      Ты хочешь заработать, но не на пирамидах. Какие есть законные
      способы для подростка?
    choices:
      - label: "A"
        text: "Крипто-трейдинг с плечом x100"
        outcome: neutral
        consequence_text: >-
          Трейдинг с плечом x100 — это не заработок, это казино с очень
          высоким риском. 95% новичков теряют всё за первый месяц. Даже
          профессионалы ошибаются. Тебе 10-14 лет — тебе рано. Сначала
          изучи основы инвестирования, начни с демо-счёта, а потом уже
          рискуй реальными деньгами.
        status_label: "Высокорисковый игрок"
        lesson_text: >-
          Трейдинг ≠ быстрый заработок. Это сложная профессия, требующая
          лет обучения.
        next: completion
      - label: "B"
        text: "Фриланс (дизайн, монтаж, программирование)"
        outcome: positive
        consequence_text: >-
          Правильно! Ты можешь делать превью для YouTube (500-1000 ₽/шт),
          монтировать видео для блогеров (2000-5000 ₽/видео), писать
          простые скрипты (3000-10000 ₽), делать дизайн для соцсетей
          (1000-3000 ₽). Это реальные деньги за реальный труд. Никакого
          скама, никаких рисков. Ты развиваешь навыки, которые пригодятся
          в любой профессии.
        achievement: legal_income
        unlock_title: >-
          Каталог платформ для подросткового фриланса (Kwork, FL.ru,
          Upwork) + Гайд «Как найти первого клиента»
        lesson_text: "Фриланс — это стабильно, безопасно и развивает навыки."
        next: completion
      - label: "C"
        text: "Ставки на киберспорт"
        outcome: negative
        consequence_text: >-
          Ставки — это азартная игра, а не заработок. Букмекеры всегда в
          плюсе (они закладывают маржу в коэффициенты). 98% игроков
          проигрывают на дистанции. Плюс это может быть незаконно для
          несовершеннолетних. Не рискуй деньгами ради адреналина.
        status_label: "Азартный игрок"
        lesson_text: "Ставки = развлечение, а не доход. Букмекеры всегда выигрывают."
        next: completion

  - key: completion
    type: completion
    message: >-
      Поздравляю! Ты прошёл карточку "Крипто-ловушка". Ты видишь
      математическую суть финансовых пирамид и знаешь законные
      альтернативы для заработка в интернете.
    achievement: antipyramid
    unlock_title: >-
      Гайд «Как отличить инвестицию от пирамиды» + Каталог безопасных
      платформ для фриланса + Чек-лист «10 признаков финансовой пирамиды»

start_node: stage1
