# Source: квест-задания.docx, СЕКТОР 3 «AI-ЛОГИКА», КАРТОЧКА 2
# «СМЕЩЁННЫЙ АЛГОРИТМ»

sector:
  slug: ai-logika
  title: "AI-Логика"
  description: >-
    Ты учишься использовать ИИ с умом: как инструмент, а не как замену
    собственному мышлению.
  color: "Неоново-фиолетовый"
  color_token: "#B14EFF"
  sort_order: 3

achievements:
  - key: dataset_work
    title: "Работа с датасетами"
    is_badge: false
  - key: bias_fighting
    title: "Борьба с алгоритмической предвзятостью"
    is_badge: false
  - key: moderation_ethics
    title: "Этика модерации"
    is_badge: false
  - key: ai_architect
    title: "Архитектор ИИ"
    is_badge: true

card:
  number: 2
  title: "Смещённый алгоритм"
  intro_text: "Создаёшь ИИ-модератора для школьного чата. Он начинает вести себя несправедливо."
  qr_token: "ai-logika-02"
  master_code_letter: "К"
  master_code_position: 10

quest:
  title: "Смещённый алгоритм"

nodes:
  - key: stage1
    message: >-
      Ты программируешь бота-модератора для школьного чата. Чтобы он
      научился отличать «плохие» сообщения от «хороших», тебе нужно дать
      ему примеры для обучения (датасет). Где ты возьмёшь эти примеры?
    choices:
      - label: "A"
        text: "Скачаю 10 000 сообщений из токсичных игровых чатов (там много мата и оскорблений)"
        outcome: negative
        consequence_text: >-
          Ты запустил бота. Через час он заблокировал 80% сообщений в
          чате, включая обычные фразы типа «Привет, как дела?» и «Кто
          сделал домашку?». Почему? Потому что он обучился только на
          агрессии и теперь считает ЛЮБОЕ сообщение подозрительным. Чат
          парализован, все недовольны.
        status_label: "Garbage In, Garbage Out (Мусор на входе = мусор на выходе)"
        lesson_text: >-
          ИИ учится на том, что ты ему даёшь. Если показать ему только
          плохие примеры, он начнёт видеть плохое везде.
        next: stage2
      - label: "B"
        text: >-
          Соберу сбалансированную базу: 5000 нормальных сообщений и 5000
          примеров спама/оскорблений с пометками
        outcome: positive
        consequence_text: >-
          Отлично! Бот увидел разницу между нормальным общением и спамом.
          Он начал корректно удалять рекламу казино и оскорбления, но
          пропускает обычные разговоры. Школа довольна, чат работает
          нормально!
        achievement: dataset_work
        unlock_title: >-
          Гайд «Как собрать сбалансированный датасет для обучения ИИ» +
          Шаблон разметки данных
        lesson_text: >-
          Для обучения ИИ нужны примеры и хорошего, и плохого. Баланс —
          ключ к справедливости.
        next: stage2
      - label: "C"
        text: "Возьму только сообщения, которые уже были удалены админами ранее"
        outcome: neutral
        consequence_text: >-
          Бот научился удалять то, что уже удаляли админы. Но он не
          понимает контекст! Например, сообщение «Ты дурак?» между
          друзьями-шутниками он удаляет, а скрытую рекламу «Заработай 100к
          в день» пропускает, потому что админы такое раньше не удаляли.
          Бот работает, но неэффективно.
        status_label: "Ограниченное обучение"
        lesson_text: >-
          Если обучать ИИ только на негативных примерах, он не научится
          различать контекст и нюансы.
        next: stage2

  - key: stage2
    message: >-
      Бот работает, но ты замечаешь странность: он чаще блокирует
      сообщения от новых учеников или сообщения, написанные с ошибками,
      считая их «спамом». Это алгоритмическая предвзятость (bias). Как это
      исправить?
    choices:
      - label: "A"
        text: "Запретить новым ученикам писать в чат первую неделю"
        outcome: negative
        consequence_text: >-
          Ты решил проблему радикально: новые ученики не могут писать
          неделю. Но это несправедливо! Они чувствуют себя изгоями, не
          могут задать вопрос по домашке, познакомиться с классом. Проблема
          не решена, а просто замаскирована.
        status_label: "Дискриминация"
        lesson_text: >-
          Запрет — это не решение проблемы bias. Это усугубляет
          несправедливость и создаёт новые проблемы.
        next: stage3
      - label: "B"
        text: >-
          Добавить в датасет больше примеров нормальных сообщений с
          ошибками и от новых пользователей
        outcome: positive
        consequence_text: >-
          Верно! Ты «дообучил» модель, показав ей, что ошибка в слове
          «привет» (например, «привеТ») — это не спам, а особенность
          набора текста. А сообщения от новых учеников типа «Всем привет,
          я новенький» — это норма. Справедливость восстановлена!
        achievement: bias_fighting
        unlock_title: >-
          Статья «Что такое bias в ИИ и как с ним бороться» + Чек-лист
          «Проверка модели на справедливость»
        lesson_text: >-
          Bias возникает из-за несбалансированных данных. Решение —
          дообучение на разнообразных примерах.
        next: stage3
      - label: "C"
        text: "Сделать бота более строгим, пусть лучше заблокирует лишнее, чем пропустит спам"
        outcome: neutral
        consequence_text: >-
          Ты сделал бота ещё строже. Теперь он блокирует 95% сообщений,
          включая «Спасибо» и «Понял». Чат превратился в пустыню. Ученики
          жалуются, что не могут нормально общаться. Проблема bias не
          решена, а усугублена.
        status_label: "Чрезмерная цензура"
        lesson_text: >-
          «Лучше заблокировать лишнее, чем пропустить» — это путь к
          тотальной цензуре. ИИ должен быть точным, а не строгим.
        next: stage3

  - key: stage3
    message: >-
      Один ученик жалуется: «Бот удалил моё сообщение, где я критиковал
      школьное меню, сказав, что это "негативный контент". Разве
      критиковать нельзя?» Что ты сделаешь как разработчик?
    choices:
      - label: "A"
        text: "Оставлю всё как есть. Критика = негатив = удаление. Так спокойнее."
        outcome: negative
        consequence_text: >-
          Ты выбрал путь наименьшего сопротивления. Но теперь ученики не
          могут высказывать мнение о школе. Это цензура! Критика меню —
          это нормально, это обратная связь. Если её удалять, школа не
          узнает о проблемах.
        status_label: "Цензор"
        lesson_text: >-
          ИИ не должен удалять конструктивную критику. Разница между
          «негативом» и «критикой» — это этическая задача, которую нужно
          решать.
        next: completion
      - label: "B"
        text: >-
          Настрою бота так, чтобы он пропускал конструктивную критику, но
          удалял личные оскорбления в адрес повара
        outcome: positive
        consequence_text: >-
          Идеальный баланс! Ты научил ИИ различать: конструктивную критику
          («Суп холодный, можно греть?» → пропускаем), личные оскорбления
          («Повар — идиот» → удаляем), спам («Купи гараж» → удаляем). Это
          сложная задача даже для больших компаний, но ты справился. Ты
          создал этичный ИИ!
        achievement: moderation_ethics
        unlock_title: >-
          Статья «Этика модерации: где проходит граница» + Гайд «Как
          настроить ИИ-модератора с учётом контекста»
        lesson_text: >-
          ИИ должен понимать контекст, а не просто искать ключевые слова.
          Это требует тонкой настройки.
        next: completion
      - label: "C"
        text: "Отключу бота вообще, пусть люди сами разбираются"
        outcome: neutral
        consequence_text: >-
          Ты отключил бота. Теперь в чате снова появился спам, оскорбления
          и реклама казино. Админы устали вручную удалять всё это. Проблема
          не решена, а просто переложена на людей.
        status_label: "Капитуляция"
        lesson_text: "Отказ от технологии — не решение. Лучше совершенствовать ИИ, чем отказываться от него."
        next: completion

  - key: completion
    type: completion
    message: >-
      Поздравляю! Ты прошёл карточку "Смещённый алгоритм". Ты узнал, что
      ИИ учится на наших данных, и научился создавать сбалансированные
      датасеты, избегать алгоритмической предвзятости и настраивать
      этичную модерацию.
    achievement: ai_architect

start_node: stage1
