server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    client_max_body_size 5m;

    # API -> backend container
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # OVERWRITE, never append ($proxy_add_x_forwarded_for): a client that
        # sends its own X-Forwarded-For must not be able to pick the address
        # the backend rate-limits (login / registration) by.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # hashed build files: cache for a year; a missing one is a real 404
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # single-page app: any other path is a client-side route
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
